<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPX Flyover</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --text:#e8eaf0; --muted:#9aa1b2; --accent:#fc4c02; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header a { color:var(--muted); font-size:14px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; padding:0 16px 12px; align-items:center; }
  .controls label { font-size:13px; color:var(--muted); display:flex; gap:6px; align-items:center; }
  select, input[type=number] { background:var(--panel); color:var(--text); border:1px solid #2a2f3a; border-radius:6px; padding:6px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.secondary { background:#2a2f3a; }
  .file { background:var(--panel); border:1px dashed #3a4050; padding:8px 12px; border-radius:6px; cursor:pointer; font-size:14px; }
  .file input { display:none; }
  #wrap { position:relative; width:100%; max-width:1280px; margin:0 auto; aspect-ratio:16/9; background:#7ea9de; overflow:hidden; }
  #wrap.vertical { aspect-ratio:9/16; max-width:420px; }
  /* map is laid out at a fixed "phone-like" size and scaled to fit, so preview == video */
  #map { position:absolute; left:0; top:0; transform-origin:0 0; }
  /* HUD (brand + stats) is drawn on a canvas with the same code as the video frames */
  #hud { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  input[type=text] { background:var(--panel); color:var(--text); border:1px solid #2a2f3a; border-radius:6px; padding:6px; }
  #status { padding:8px 16px; color:var(--muted); font-size:13px; min-height:20px; }
  #bar { height:4px; background:#2a2f3a; margin:0 16px 8px; border-radius:2px; overflow:hidden; display:none; }
  #bar div { height:100%; width:0; background:var(--accent); }
  #download { display:none; padding:12px 16px 24px; max-width:1280px; margin:0 auto; }
  #download video { max-width:100%; max-height:70vh; display:block; margin-bottom:8px; }
  #download a { color:var(--accent); font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>🛰️ GPX Flyover</h1>
  <a href="/">← Shortlink</a>
</header>
<div class="controls">
  <label class="file">📂 Upload GPX<input type="file" id="gpx" accept=".gpx,application/gpx+xml"></label>
  <label>Format
    <select id="format">
      <option value="v1080">Vertical 9:16 · Story 1080×1920</option>
      <option value="v720">Vertical 9:16 · Story 720×1280</option>
      <option value="l1080">Landscape 16:9 · 1080p</option>
      <option value="l720">Landscape 16:9 · 720p</option>
    </select>
  </label>
  <label>Durasi video
    <select id="duration">
      <option value="auto">Otomatis (maks 60 dtk)</option>
      <option value="15">15 dtk</option>
      <option value="30">30 dtk</option>
      <option value="60">60 dtk</option>
      <option value="90">90 dtk</option>
      <option value="120">120 dtk</option>
    </select>
  </label>
  <label>Gaya peta
    <select id="style">
      <option value="satellite">Satelit</option>
      <option value="streets">Jalan (OSM)</option>
    </select>
  </label>
  <label>Zoom kamera
    <select id="zoomlvl">
      <option value="1">Sangat dekat</option>
      <option value="0" selected>Dekat</option>
      <option value="-1.5">Sedang</option>
      <option value="-3">Jauh</option>
    </select>
  </label>
  <label title="Kalau rute terlalu panjang untuk durasinya, kamera mundur sedikit supaya gerakan tidak terlalu cepat">
    <input type="checkbox" id="readable" checked> Jaga nama jalan terbaca</label>
  <label>Pitch <input type="number" id="pitch" value="75" min="0" max="80" style="width:56px"></label>
  <label>Brand <input type="text" id="brand" value="Gowesementara" maxlength="40" style="width:150px"></label>
  <label class="file">🖼 Logo (opsional)<input type="file" id="logo" accept="image/*"></label>
  <label>FPS
    <select id="fps">
      <option value="30">30</option>
      <option value="60">60</option>
    </select>
  </label>
  <button id="preview" class="secondary" disabled>▶ Preview</button>
  <button id="record" disabled>⏺ Generate Video</button>
</div>
<div id="status">Upload file .gpx untuk memulai.</div>
<div id="bar"><div></div></div>
<div id="wrap">
  <div id="map"></div>
  <canvas id="hud"></canvas>
</div>
<div id="download"></div>

<script>
const $ = id => document.getElementById(id);
const status = t => $('status').textContent = t;
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- map setup ----------
const STYLES = {
  satellite: { type:'raster', tileSize:256, maxzoom:19,
    tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
    attribution:'Imagery © Esri' },
  streets: { type:'raster', tileSize:256, maxzoom:19,
    tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
    attribution:'© OpenStreetMap contributors' }
};
// colour of the distant haze; also fills the gap between the farthest terrain and the sky
const HAZE = '#7ea9de';
const ATTRIB = { satellite: 'Imagery © Esri · © OpenStreetMap · OpenFreeMap', streets: '© OpenStreetMap contributors' };
// free vector tiles (OpenStreetMap data, OpenMapTiles schema) for crisp road/place names
const OFM = 'https://tiles.openfreemap.org';
const ROAD_CLASSES = ['motorway', 'trunk', 'primary', 'secondary', 'tertiary', 'minor', 'service'];

// Road and place names drawn as real text: upright towards the camera (not squashed on the
// ground like raster labels at high pitch), white with a dark halo so they read on imagery.
function labelLayers() {
  const halo = { 'text-color':'#ffffff', 'text-halo-color':'rgba(0,0,0,0.85)', 'text-halo-width':1.8, 'text-halo-blur':0.3 };
  return [
    { id:'road-lines', type:'line', source:'omt', 'source-layer':'transportation',
      filter: ['match', ['get','class'], ROAD_CLASSES, true, false],
      layout: { 'line-cap':'round', 'line-join':'round' },
      paint: { 'line-color':'rgba(255,255,255,0.4)',
        'line-width': ['interpolate', ['exponential', 1.6], ['zoom'],
          12, ['match', ['get','class'], ['motorway','trunk','primary'], 1.4, 0.5],
          18, ['match', ['get','class'], ['motorway','trunk','primary'], 10, ['secondary','tertiary'], 7, 4]] } },
    { id:'road-names', type:'symbol', source:'omtlabels', 'source-layer':'transportation_name',
      filter: ['all', ['has','name'], ['match', ['get','class'], ROAD_CLASSES, true, false]],
      layout: { 'symbol-placement':'line', 'text-field':['get','name'], 'text-font':['Noto Sans Bold'],
        'text-size': ['match', ['get','class'], ['motorway','trunk','primary','secondary'], 17, 15],
        'text-pitch-alignment':'viewport', 'text-rotation-alignment':'map', 'text-keep-upright':true,
        'text-max-angle':35, 'symbol-spacing':280, 'text-padding':6, 'text-letter-spacing':0.02 },
      paint: halo },
    { id:'place-names', type:'symbol', source:'omtlabels', 'source-layer':'place',
      filter: ['all', ['has','name'], ['match', ['get','class'], ['city','town','village','suburb','quarter','neighbourhood','hamlet'], true, false]],
      layout: { 'text-field':['get','name'], 'text-font':['Noto Sans Bold'],
        'text-size': ['match', ['get','class'], 'city', 22, 'town', 19, ['village','suburb'], 17, 15],
        'text-pitch-alignment':'viewport', 'text-padding':8, 'text-max-width':8, 'text-letter-spacing':0.03 },
      paint: { ...halo, 'text-color':'#fff7d6', 'text-halo-width':2 } }
  ];
}

function buildStyle(kind) {
  return {
    version: 8,
    transition: { duration: 0, delay: 0 },
    glyphs: `${OFM}/fonts/{fontstack}/{range}.pbf`,
    sources: {
      base: STYLES[kind],
      ...(kind === 'satellite' ? {
        // same tiles twice: 'omt' (road lines, normal detail levels) and 'omtlabels' (names,
        // locked to one detail level near the camera, see patchCoveringTiles)
        omt: { type:'vector', url:`${OFM}/planet` },
        omtlabels: { type:'vector', url:`${OFM}/planet` }
      } : {}),
      dem: { type:'raster-dem', encoding:'terrarium', tileSize:256, maxzoom:13,
        tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'] }
    },
    // blue sky with a hazy horizon above the 3D terrain
    sky: {
      'sky-color': '#0b44bf', 'horizon-color': HAZE, 'fog-color': HAZE,
      'sky-horizon-blend': 0.45, 'horizon-fog-blend': 0.5, 'fog-ground-blend': 0.85, 'atmosphere-blend': 0
    },
    layers: [
      { id:'bg', type:'background', paint:{ 'background-color':'#2d3b2a' } },
      // no fade: every frame shows fully loaded tiles, no cross-fade flicker
      { id:'base', type:'raster', source:'base', paint:{ 'raster-fade-duration': 0 } },
      // road lines + road/place names on top of satellite imagery
      ...(kind === 'satellite' ? labelLayers() : [])
    ],
    terrain: { source:'dem', exaggeration:1.4 }
  };
}

maplibregl.setMaxParallelImageRequests(24);
const map = new maplibregl.Map({
  container: 'map', style: buildStyle('satellite'),
  center: [106.8, -6.2], zoom: 4, pitch: 0, maxPitch: 80,
  fadeDuration: 0, maxTileCacheSize: 2000,
  preserveDrawingBuffer: true, attributionControl: { compact: true }
});

let track = null;

// ---------- output format / layout ----------
// The map is always laid out at a phone-like CSS size (short side 540px) and rendered with
// pixelRatio = output/layout. Raster road labels therefore come out ~2x bigger in a 1080p video
// and stay readable on a phone.
const FORMATS = { v1080: [1080, 1920], v720: [720, 1280], l1080: [1920, 1080], l720: [1280, 720] };
function fmt() {
  const [W, H] = FORMATS[$('format').value] || FORMATS.l720, vertical = H > W;
  return { W, H, vertical, lw: vertical ? 540 : 960, lh: vertical ? 960 : 540 };
}
let recordPR = null;
function applyLayout() {
  const f = fmt(), mapEl = $('map'), wrap = $('wrap');
  wrap.classList.toggle('vertical', f.vertical);
  mapEl.style.width = f.lw + 'px';
  mapEl.style.height = f.lh + 'px';
  const sc = wrap.clientWidth / f.lw;
  mapEl.style.transform = `scale(${sc})`;
  map.setPixelRatio(recordPR || Math.max(1, (window.devicePixelRatio || 1) * sc));
  map.resize();
  if (typeof renderHud === 'function' && document.readyState !== 'loading') renderHud();
}
applyLayout();
window.addEventListener('resize', applyLayout);
$('format').addEventListener('change', () => {
  applyLayout();
  if (track) map.fitBounds(trackBounds(), { padding: 40, pitch: 0, bearing: 0, duration: 0, freezeElevation: true });
});

// ---------- GPX parsing ----------
function haversine(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b[1]-a[1])*r, dLon = (b[0]-a[0])*r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function parseGPX(text) {
  const xml = new DOMParser().parseFromString(text, 'application/xml');
  let pts = [...xml.getElementsByTagName('trkpt')];
  if (!pts.length) pts = [...xml.getElementsByTagName('rtept')];
  if (pts.length < 2) throw new Error('Tidak ada titik track di file GPX');
  const raw = pts.map(p => {
    const ele = p.getElementsByTagName('ele')[0];
    const tm = p.getElementsByTagName('time')[0];
    // heart rate lives in extensions, e.g. <gpxtpx:hr> (Garmin/Strava/COROS exports)
    const hr = p.getElementsByTagNameNS('*', 'hr')[0];
    return [+p.getAttribute('lon'), +p.getAttribute('lat'),
            ele ? +ele.textContent : 0, tm ? Date.parse(tm.textContent) : null,
            hr && +hr.textContent > 0 ? +hr.textContent : null];
  }).filter(c => isFinite(c[0]) && isFinite(c[1]));

  // drop duplicate points (zero-length segments)
  const coords = [raw[0]];
  for (let i = 1; i < raw.length; i++) if (haversine(coords[coords.length-1], raw[i]) > 0.0005) coords.push(raw[i]);
  const cum = [0];
  for (let i = 1; i < coords.length; i++) cum.push(cum[i-1] + haversine(coords[i-1], coords[i]));
  const total = cum[cum.length-1];
  if (!(total > 0)) throw new Error('Track terlalu pendek');

  // decimated geometry for drawing (max ~4000 vertices keeps per-frame updates cheap)
  const step = total / 4000, drawIdx = [0];
  for (let i = 1; i < coords.length - 1; i++) if (cum[i] - cum[drawIdx[drawIdx.length-1]] >= step) drawIdx.push(i);
  drawIdx.push(coords.length - 1);

  // uniformly resampled + smoothed path for the camera (removes GPS jitter)
  const N = Math.min(6000, Math.max(400, Math.round(total / 0.01)));
  const res = [];
  for (let i = 0; i <= N; i++) { const p = interp(coords, cum, total * i / N); res.push([p.lon, p.lat]); }
  const midLat = drawIdx.reduce((a, i) => a + coords[i][1], 0) / drawIdx.length;

  // smooth path is (re)computed per plan, with a window that depends on the zoom
  const hasHr = coords.some(c => c[4] != null);
  return { coords, cum, total, drawIdx, res, smooth: res, N, midLat, hasHr };
}

function movingAverage(arr, w) {
  const n = arr.length, sx = [0], sy = [0];
  for (const p of arr) { sx.push(sx[sx.length-1] + p[0]); sy.push(sy[sy.length-1] + p[1]); }
  return arr.map((_, i) => {
    const k = Math.min(w, i, n - 1 - i), a = i - k, b = i + k + 1;
    return [(sx[b]-sx[a])/(b-a), (sy[b]-sy[a])/(b-a)];
  });
}

function interp(coords, cum, d) {
  let lo = 0, hi = cum.length - 1;
  while (lo < hi - 1) { const m = (lo+hi) >> 1; if (cum[m] <= d) lo = m; else hi = m; }
  const seg = cum[hi] - cum[lo] || 1, t = Math.min(1, Math.max(0, (d - cum[lo]) / seg));
  const a = coords[lo], b = coords[hi];
  return { idx: lo, lon: a[0]+(b[0]-a[0])*t, lat: a[1]+(b[1]-a[1])*t, ele: a[2]+(b[2]-a[2])*t,
           time: a[3] != null && b[3] != null ? a[3]+(b[3]-a[3])*t : null,
           hr: a[4] != null && b[4] != null ? a[4]+(b[4]-a[4])*t : (a[4] ?? b[4] ?? null) };
}
const pointAt = d => interp(track.coords, track.cum, d);

function smoothAt(d) {
  const f = Math.min(1, Math.max(0, d / track.total)) * track.N, i = Math.min(track.N - 1, Math.floor(f)), t = f - i;
  const a = track.smooth[i], b = track.smooth[i+1];
  return { lon: a[0]+(b[0]-a[0])*t, lat: a[1]+(b[1]-a[1])*t };
}

function bearing(a, b) {
  const r = Math.PI/180;
  const y = Math.sin((b.lon-a.lon)*r)*Math.cos(b.lat*r);
  const x = Math.cos(a.lat*r)*Math.sin(b.lat*r) - Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lon-a.lon)*r);
  return Math.atan2(y, x) / r;
}

// ---------- map layers ----------
const ROUTE_COLOR = '#cdf227';
const drawCoords = () => track.drawIdx.map(i => [track.coords[i][0], track.coords[i][1]]);

function addLayers() {
  markLabelSources();
  if (!track) return;
  const line = { type:'Feature', geometry:{ type:'LineString', coordinates: drawCoords() } };
  if (map.getSource('full')) { map.getSource('full').setData(line); return; }
  map.addSource('full', { type:'geojson', data: line });
  map.addSource('done', { type:'geojson', data: { type:'FeatureCollection', features:[] } });
  map.addSource('head', { type:'geojson', data: { type:'FeatureCollection', features:[] } });
  const lineLayout = { 'line-cap':'round', 'line-join':'round' };
  const below = map.getLayer('road-names') ? 'road-names' : undefined;   // keep names readable on top of the route
  map.addLayer({ id:'full', type:'line', source:'full', paint:{ 'line-color':ROUTE_COLOR, 'line-width':4, 'line-opacity':.85 }, layout: lineLayout }, below);
  map.addLayer({ id:'done', type:'line', source:'done', paint:{ 'line-color':ROUTE_COLOR, 'line-width':6 }, layout: lineLayout }, below);
  map.addLayer({ id:'head', type:'circle', source:'head', paint:{ 'circle-radius':10, 'circle-color':'#ef4058', 'circle-stroke-color':'#ffffff', 'circle-stroke-width':3 } });
}
// style JSON ready (tiles may still be loading) -> safe to add our sources/layers
let styleReady = false;
map.on('style.load', () => { styleReady = true; addLayers(); });

function trackBounds() {
  const b = new maplibregl.LngLatBounds();
  track.drawIdx.forEach(i => b.extend([track.coords[i][0], track.coords[i][1]]));
  return b;
}

$('gpx').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    track = parseGPX(await f.text());
    await ensureLayers();
    map.fitBounds(trackBounds(), { padding: 60, pitch: 0, bearing: 0, duration: 1500, freezeElevation: true });
    $('preview').disabled = $('record').disabled = false;
    status(`${f.name}: ${track.coords.length} titik, ${track.total.toFixed(2)} km` + (track.hasHr ? ' · ada data detak jantung' : ''));
    renderHud(statAt(0));
  } catch (err) { status('Gagal membaca GPX: ' + err.message); }
});

$('style').addEventListener('change', e => { styleReady = false; map.setStyle(buildStyle(e.target.value), { diff: false }); renderHud(); });
$('brand').addEventListener('input', () => renderHud());
$('logo').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) { logoImg = null; return renderHud(); }
  const img = new Image();
  img.src = URL.createObjectURL(f);
  try { await img.decode(); logoImg = img; } catch { logoImg = null; status('Logo tidak bisa dibaca, gunakan PNG/JPG.'); }
  renderHud();
});

// make sure the route sources/layers exist (style may have been swapped or still loading)
async function ensureLayers() {
  if (!styleReady) await new Promise(r => { const f = () => styleReady ? r() : setTimeout(f, 50); f(); });
  if (!map.getSource('done')) {
    for (const id of ['head', 'done', 'full']) if (map.getLayer(id)) map.removeLayer(id);
    for (const id of ['full', 'done', 'head']) if (map.getSource(id)) map.removeSource(id);
  }
  addLayers();
}

// ---------- camera plan (deterministic, precomputed per frame) ----------
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - (-2*t+2)**3/2;
// trapezoid velocity: smooth accel/decel, constant speed in the middle
function progress(t, a = 0.08) {
  const v = 1 / (1 - a);
  if (t < a) return v * t * t / (2 * a);
  if (t > 1 - a) return 1 - v * (1 - t) ** 2 / (2 * a);
  return v * (t - a / 2);
}
const lerp = (a, b, t) => a + (b - a) * t;
// shortest signed angle from a to b, in (-180, 180]; safe for unwrapped (large/negative) angles
const angDiff = (a, b) => (((b - a) % 360) + 540) % 360 - 180;

// camera move that zooms + pans without the "sliding" look (pan mostly happens while zoomed out)
function zoomPan(A, B, t) {
  const e = easeInOut(t), z = lerp(A.zoom, B.zoom, e), dz = B.zoom - A.zoom;
  const w = Math.abs(dz) < 1e-3 ? e : (1 - 2 ** -(z - A.zoom)) / (1 - 2 ** -dz);
  return { center: [lerp(A.center[0], B.center[0], w), lerp(A.center[1], B.center[1], w)],
           zoom: z, pitch: lerp(A.pitch, B.pitch, e), bearing: A.bearing + angDiff(A.bearing, B.bearing) * e,
           padding: { top: Math.round(lerp(A.padding.top, B.padding.top, e)), bottom: 0, left: 0, right: 0 } };
}

// metres per CSS pixel at zoom z (MapLibre uses 512px world tiles)
const mpp = (z, lat) => 40075016.686 * Math.cos(lat * Math.PI / 180) / (512 * 2 ** z);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
// max on-screen ground speed (CSS px / s at screen centre) where street names stay readable
const MAX_PX_PER_SEC = 300;
// intro hold + zoom-in + zoom-out + end hold
const EXTRA_SEC = 0.6 + 3 + 3 + 2;

function buildPlan(fps) {
  const f = fmt();
  map.setPadding({ top: 0, bottom: 0, left: 0, right: 0 });
  const topPad = Math.round(f.lh * (f.vertical ? 0.3 : 0.2));
  const pad = t => ({ top: Math.round(topPad * t), bottom: 0, left: 0, right: 0 });
  const pitch = clamp(+$('pitch').value || 0, 0, 80);
  const total = track.total, L = total * 1000, lat = track.midLat;
  const zUser = Math.min(19, clamp(18 - Math.log2(Math.max(total, 1)) * 0.2, 16.5, 18) + (+$('zoomlvl').value || 0));
  const PEAK = 1.09; // peak / average speed of the trapezoid profile
  const readableSec = z => L * PEAK / (MAX_PX_PER_SEC * mpp(z, lat));

  // duration: auto = as long as needed to stay readable at the chosen zoom (story-friendly, <= 60s total)
  const durSel = $('duration').value;
  const durSec = durSel === 'auto' ? clamp(readableSec(zUser), 8, 60 - EXTRA_SEC) : Math.max(5, +durSel - EXTRA_SEC);
  // still too fast for that duration? pull the camera back just enough to keep names readable
  const zFit = Math.log2(40075016.686 * Math.cos(lat * Math.PI / 180) / (512 * (L * PEAK / (durSec * MAX_PX_PER_SEC))));
  const zoom = $('readable').checked ? Math.min(zUser, zFit) : zUser;
  const m = mpp(zoom, lat) / 1000; // km per CSS px

  // camera path: remove GPS jitter (~80px window) ; heading looks ~0.6 screen ahead
  const win = Math.max(1, Math.round(80 * m / (total / track.N)));
  track.smooth = movingAverage(track.res, win);
  const look = Math.min(total, Math.max(0.05, 0.6 * f.lh * m));

  // flight distances + raw bearings
  const nFly = Math.round(durSec * fps);
  const ds = [], br = [];
  for (let i = 0; i <= nFly; i++) {
    const d = progress(i / nFly) * total;
    ds.push(d);
    const db = Math.min(d, Math.max(0, total - look));
    br.push(bearing(smoothAt(db), smoothAt(Math.min(total, db + look))));
  }
  // unwrap, then forward-backward exponential smoothing (no lag, no sudden turns)
  for (let i = 1; i < br.length; i++) br[i] = br[i-1] + angDiff(br[i-1], br[i]);
  const alpha = 1 - Math.exp(-1 / (fps * 1.5));
  for (let i = 1; i < br.length; i++) br[i] = br[i-1] + (br[i] - br[i-1]) * alpha;
  for (let i = br.length - 2; i >= 0; i--) br[i] = br[i+1] + (br[i] - br[i+1]) * alpha;
  // limit rotation speed (rotating raster labels are hard to read): average of a forward- and a
  // backward-limited pass keeps the limit and cancels the lag
  const maxStep = 25 / fps, fw = br.slice(), bw = br.slice();
  for (let i = 1; i < fw.length; i++) fw[i] = fw[i-1] + clamp(fw[i] - fw[i-1], -maxStep, maxStep);
  for (let i = bw.length - 2; i >= 0; i--) bw[i] = bw[i+1] + clamp(bw[i] - bw[i+1], -maxStep, maxStep);
  for (let i = 0; i < br.length; i++) br[i] = (fw[i] + bw[i]) / 2;

  const frames = [];
  const push = (cam, d) => frames.push({ cam, d, stats: statAt(d) });

  const bounds = trackBounds();
  const ov = map.cameraForBounds(bounds, { padding: 40, bearing: 0 });
  const overview = { center: ov.center.toArray ? ov.center.toArray() : [ov.center.lng, ov.center.lat], zoom: ov.zoom, pitch: 0, bearing: 0, padding: pad(0) };
  const s0 = smoothAt(0);
  const startCam = { center: [s0.lon, s0.lat], zoom, pitch, bearing: br[0], padding: pad(1) };

  // intro: hold overview, then zoom in to start
  for (let i = 0; i < fps * 0.6; i++) push(overview, 0, false);
  const nIntro = Math.round(fps * 3);
  for (let i = 1; i <= nIntro; i++) push(zoomPan(overview, startCam, i / nIntro), 0, i / nIntro > .5);

  // flight
  for (let i = 0; i <= nFly; i++) {
    const c = smoothAt(ds[i]);
    push({ center: [c.lon, c.lat], zoom, pitch, bearing: br[i], padding: pad(1) }, ds[i], true);
  }

  // outro: pull back to whole route (tilted), then hold
  const endCam = frames[frames.length - 1].cam;
  const fo = map.cameraForBounds(bounds, { padding: 40, bearing: endCam.bearing });
  const finalCam = { center: fo.center.toArray ? fo.center.toArray() : [fo.center.lng, fo.center.lat],
                     zoom: fo.zoom - 0.4, pitch: Math.min(pitch, 45), bearing: endCam.bearing, padding: pad(0) };
  const nOut = Math.round(fps * 3);
  for (let i = 1; i <= nOut; i++) push(zoomPan(endCam, finalCam, i / nOut), total, true);
  const nHold = Math.round(fps * 2);
  for (let i = 1; i <= nHold; i++) push({ ...finalCam, bearing: finalCam.bearing + 8 * easeInOut(i / nHold) }, total, true);
  frames.info = {
    seconds: frames.length / fps, zoom, zUser,
    note: zoom < zUser - 0.05
      ? `Rute ${total.toFixed(1)} km terlalu panjang untuk durasi ini, kamera sedikit dimundurkan supaya nama jalan tetap terbaca. Pilih durasi lebih panjang untuk kamera lebih dekat.`
      : ''
  };
  return frames;
}

// ---------- label tiles: one zoom level, limited distance ----------
// With 3D terrain MapLibre draws far-away areas with lower-zoom tiles. Label tiles of each zoom
// level contain a different set of names at different positions, so while flying a road name would
// suddenly jump or swap when its area switches level. During playback the label sources therefore only use tiles of the highest level,
// and only up to LABEL_RANGE x the camera->centre distance (further away text is tiny and in the
// horizon haze; covering everything up to the horizon at high pitch would need thousands of tiles).
const LABEL_SOURCES = ['omtlabels'];
const LABEL_MARK = 0.25;   // minzoom marker that identifies the label sources inside coveringTiles()
const LABEL_RANGE = 4;
let labelLock = false;

function markLabelSources() {
  for (const id of LABEL_SOURCES) { const src = map.getSource(id); if (src) src.minzoom = LABEL_MARK; }
}
// a vector source's TileJSON arrives later and resets minzoom: mark again once it is loaded
map.on('sourcedata', e => { if (LABEL_SOURCES.includes(e.sourceId) && e.sourceDataType === 'metadata') markLabelSources(); });

(function patchCoveringTiles() {
  const tr = map.transform, orig = tr.coveringTiles;
  tr.coveringTiles = function (opts) {
    if (opts.minzoom !== LABEL_MARK) return orig.call(this, opts);
    const lod = orig.call(this, { ...opts, minzoom: 0 });
    if (!labelLock || !lod.length) return lod;
    // label level from the camera zoom (same rule as MapLibre's coveringZoomLevel), so it never
    // changes while the zoom is constant
    const zFull = Math.max(0, (opts.roundZoom ? Math.round : Math.floor)(this.zoom + Math.log2(this.tileSize / opts.tileSize)));
    const zMax = Math.min(opts.maxzoom, zFull);
    const ovZ = opts.reparseOverscaled ? zFull : zMax;   // vector tiles beyond maxzoom are overscaled
    const n = 2 ** zMax;
    const cam = this.pointCoordinate(this.getCameraPoint());
    const ctr = maplibregl.MercatorCoordinate.fromLngLat(this.center);
    const cx = cam.x * n, cy = cam.y * n;
    const range = LABEL_RANGE * Math.hypot(ctr.x * n - cx, ctr.y * n - cy) + 2;
    const out = [];
    const expand = t => {
      const sz = 2 ** (zMax - t.canonical.z);
      const x0 = t.canonical.x * sz + t.wrap * n, y0 = t.canonical.y * sz;
      const dx = Math.max(x0 - cx, 0, cx - (x0 + sz)), dy = Math.max(y0 - cy, 0, cy - (y0 + sz));
      if (Math.hypot(dx, dy) > range) return;           // too far: no labels there
      if (t.canonical.z >= zMax) out.push(t.overscaledZ === ovZ ? t : new t.constructor(ovZ, t.wrap, t.canonical.z, t.canonical.x, t.canonical.y));
      else for (const c of t.children(Infinity)) expand(c);
    };
    for (const t of lod) expand(t);
    return out;
  };
})();

// ---------- apply one frame ----------
let lastIdx = -1;
function applyFrame(f) {
  const d = f.d, p = pointAt(d);
  if (d <= 0) {
    if (lastIdx !== -2) map.getSource('done').setData({ type:'FeatureCollection', features:[] });
    lastIdx = -2;
  } else {
    // done line: decimated vertices up to current point + exact head position
    const di = track.drawIdx; let k = 0, hi = di.length - 1;
    while (k < hi) { const m = (k + hi + 1) >> 1; if (di[m] <= p.idx) k = m; else hi = m - 1; }
    const coords = [];
    for (let j = 0; j <= k; j++) coords.push([track.coords[di[j]][0], track.coords[di[j]][1]]);
    coords.push([p.lon, p.lat]);
    map.getSource('done').setData({ type:'Feature', geometry:{ type:'LineString', coordinates: coords } });
    lastIdx = p.idx;
  }
  map.getSource('head').setData({ type:'Point', coordinates:[p.lon, p.lat] });
  // MapLibre 4 freezes the camera altitude during easeTo/flyTo with terrain and only unfreezes it
  // with `freezeElevation`; a frozen altitude makes the rider drift up/down the screen over hills.
  // Every render must use the ground height under the camera centre.
  map.stop();
  map._elevationFreeze = false;
  map.jumpTo(f.cam);
}

// speed (km/h) averaged over ±150 m of track, null if the GPX has no timestamps
function speedAt(d) {
  if (track.coords[0][3] == null) return null;
  const w = Math.min(0.15, track.total / 2);
  const a = Math.max(0, Math.min(d - w, track.total - 2 * w)), b = a + 2 * w;
  const ta = pointAt(a).time, tb = pointAt(b).time;
  if (ta == null || tb == null || tb <= ta) return null;
  return (b - a) / ((tb - ta) / 3600000);
}
// heart rate averaged over ±150 m, null if the GPX has none
function hrAt(d) {
  if (!track.hasHr) return null;
  const w = Math.min(0.15, track.total / 2);
  let sum = 0, n = 0;
  for (let i = 0; i <= 6; i++) { const v = pointAt(clamp(d - w + (2 * w * i) / 6, 0, track.total)).hr; if (v != null) { sum += v; n++; } }
  return n ? sum / n : null;
}
const statAt = d => ({ d, ele: pointAt(d).ele, speed: speedAt(d), hr: hrAt(d) });

// ---------- HUD: brand + stat row with icons (drawn the same in preview and video) ----------
let logoImg = null, lastStats = null;
const FONT_NUM = '"Barlow Condensed", "Arial Narrow", system-ui, sans-serif';
const FONT_BRAND = 'Montserrat, system-ui, sans-serif';

function drawIcon(ctx, type, cx, cy, s) {
  ctx.save();
  ctx.fillStyle = ctx.strokeStyle = '#fff';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (type === 'dist') {            // road in perspective with a dashed centre line
    ctx.lineWidth = s * 0.13;
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.16, cy - s * 0.45); ctx.lineTo(cx - s * 0.42, cy + s * 0.45);
    ctx.moveTo(cx + s * 0.16, cy - s * 0.45); ctx.lineTo(cx + s * 0.42, cy + s * 0.45);
    ctx.stroke();
    ctx.lineWidth = s * 0.1;
    for (const [a, b] of [[-0.42, -0.24], [-0.08, 0.1], [0.26, 0.45]]) {
      ctx.beginPath(); ctx.moveTo(cx, cy + a * s); ctx.lineTo(cx, cy + b * s); ctx.stroke();
    }
  } else if (type === 'speed') {    // gauge with needle
    ctx.lineWidth = s * 0.12;
    ctx.beginPath(); ctx.arc(cx, cy + s * 0.08, s * 0.42, Math.PI * 0.8, Math.PI * 2.2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy + s * 0.08); ctx.lineTo(cx + s * 0.24, cy - s * 0.16); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy + s * 0.08, s * 0.09, 0, Math.PI * 2); ctx.fill();
  } else if (type === 'elev') {     // two peaks
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.5, cy + s * 0.4); ctx.lineTo(cx - s * 0.1, cy - s * 0.42); ctx.lineTo(cx + s * 0.12, cy + s * 0.02);
    ctx.lineTo(cx + s * 0.27, cy - s * 0.16); ctx.lineTo(cx + s * 0.5, cy + s * 0.4); ctx.closePath(); ctx.fill();
  } else if (type === 'hr') {       // heart
    ctx.beginPath();
    for (let i = 0; i <= 64; i++) {
      const t = (i / 64) * Math.PI * 2;
      const x = 16 * Math.sin(t) ** 3, y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      const px = cx + x * s / 34, py = cy - y * s / 34 - s * 0.04;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.fill();
  }
  ctx.restore();
}

function drawHud(ctx, W, H, s, attrib) {
  const k = Math.min(W, H) / 1080, vertical = H > W;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 12 * k; ctx.shadowOffsetY = 2 * k;

  // brand (optional logo on the left of the text)
  const brand = ($('brand').value || '').trim();
  const brandY = vertical ? H * 0.115 : H * 0.095, bSize = 54 * k;
  ctx.font = `800 ${bSize}px ${FONT_BRAND}`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${4 * k}px`;
  const tw = brand ? ctx.measureText(brand).width : 0;
  const lh = bSize * 1.35, lw = logoImg ? lh * logoImg.naturalWidth / logoImg.naturalHeight : 0, gap = logoImg && brand ? 18 * k : 0;
  const bx = W / 2 - (lw + gap + tw) / 2;
  if (logoImg) ctx.drawImage(logoImg, bx, brandY - bSize * 0.37 - lh / 2, lw, lh);
  if (brand) { ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText(brand, bx + lw + gap, brandY); ctx.textAlign = 'center'; }
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';

  // stat row: distance, speed, elevation, heart rate (only those the GPX has)
  if (s) {
    const items = [{ icon: 'dist', v: s.d.toFixed(2), u: 'km' }];
    if (s.speed != null) items.push({ icon: 'speed', v: s.speed.toFixed(1), u: 'km/h' });
    items.push({ icon: 'elev', v: String(Math.round(s.ele)), u: 'm' });
    if (s.hr != null) items.push({ icon: 'hr', v: String(Math.round(s.hr)), u: 'bpm' });
    const rowW = vertical ? W : Math.min(W * 0.75, items.length * 330 * k), x0 = (W - rowW) / 2;
    const iconY = vertical ? H * 0.185 : H * 0.2;
    items.forEach((it, i) => {
      const cx = x0 + rowW * (i + 0.5) / items.length;
      drawIcon(ctx, it.icon, cx, iconY, 50 * k);
      ctx.fillStyle = '#fff';
      ctx.font = `600 ${86 * k}px ${FONT_NUM}`; ctx.fillText(it.v, cx, iconY + 112 * k);
      ctx.font = `500 ${44 * k}px ${FONT_NUM}`; ctx.fillText(it.u, cx, iconY + 162 * k);
    });
  }

  // map attribution (required by the tile providers)
  ctx.shadowBlur = 4 * k; ctx.textAlign = 'left';
  ctx.font = `${18 * k}px system-ui, sans-serif`; ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText(attrib, 16 * k, H - 16 * k);
  ctx.restore();
}

// draw the HUD on the on-screen canvas over the map
function renderHud(s = lastStats) {
  lastStats = s;
  const c = $('hud'), dpr = window.devicePixelRatio || 1;
  const w = Math.round($('wrap').clientWidth * dpr), h = Math.round($('wrap').clientHeight * dpr);
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  drawHud(ctx, w, h, s, ATTRIB[$('style').value]);
}
const loadFonts = () => Promise.all([
  document.fonts.load(`600 80px ${FONT_NUM}`), document.fonts.load(`800 50px ${FONT_BRAND}`)
]).catch(() => {});

// ---------- preview (realtime, not recorded) ----------
let running = false;
function setBusy(b) {
  running = b;
  for (const id of ['preview', 'record', 'gpx', 'style', 'format', 'fps', 'duration', 'pitch', 'zoomlvl', 'readable', 'brand', 'logo']) $(id).disabled = b;
}

$('preview').addEventListener('click', async () => {
  if (running || !track) return;
  setBusy(true);
  await Promise.all([ensureLayers(), loadFonts()]);
  labelLock = true;
  const fps = 30, frames = buildPlan(fps);
  status(`Preview ±${Math.round(frames.info.seconds)} dtk… (hasil Generate lebih mulus & tajam) ${frames.info.note}`);
  await new Promise(resolve => {
    const begin = performance.now();
    (function tick(now) {
      const i = Math.min(frames.length - 1, Math.floor((now - begin) / 1000 * fps));
      applyFrame(frames[i]); renderHud(frames[i].stats);
      if (i < frames.length - 1 && running) requestAnimationFrame(tick); else resolve();
    })(begin);
  });
  labelLock = false; map.triggerRepaint();
  status('Preview selesai.');
  setBusy(false);
});

// ---------- offline render: wait for tiles every frame, encode at fixed fps ----------
// Render the current camera, then re-render only when new tiles/data arrive,
// until everything in view is loaded (or timeout). Returns true if fully loaded.
// Render, and if tiles are missing wait for them WITHOUT rendering, then render again.
// Usually 1-2 renders per video frame.
const ALL_SOURCES = ['base', 'omt', 'omtlabels', 'dem', 'full', 'done', 'head'];
async function renderReady(maxMs = 30000) {
  const t = performance.now();
  for (let pass = 0; pass < 30; pass++) {
    map.redraw();
    if (map.loaded()) return true;
    while (!ALL_SOURCES.every(id => !map.getSource(id) || map.isSourceLoaded(id))) {
      if (performance.now() - t > maxMs) { map.redraw(); return false; }
      await sleep(4);
    }
  }
  map.redraw();
  return map.loaded();
}

// While recording we drive rendering ourselves; stop MapLibre's own rAF repaints
// so they don't compete with the encoder for CPU/GPU.
function takeOverRendering() {
  const orig = map.triggerRepaint;
  map.triggerRepaint = () => {};
  return () => { map.triggerRepaint = orig; map.triggerRepaint(); };
}

async function pickCodec(W, H, fps) {
  const bitrate = W * H >= 1920 * 1080 ? 18_000_000 : 10_000_000;
  const cands = [
    ['avc1.640033', 'avc'], ['avc1.640028', 'avc'], ['avc1.4d0028', 'avc'], ['avc1.42003e', 'avc'], ['avc1.42001f', 'avc'],
    ['vp09.00.40.08', 'vp9'], ['vp09.00.10.08', 'vp9']
  ];
  for (const [codec, mux] of cands) {
    const cfg = { codec, width: W, height: H, bitrate, framerate: fps, latencyMode: 'quality' };
    if (mux === 'avc') cfg.avc = { format: 'avc' };
    try { if ((await VideoEncoder.isConfigSupported(cfg)).supported) return { cfg, mux }; } catch {}
  }
  return null;
}


$('record').addEventListener('click', async () => {
  if (running || !track) return;
  if (!window.VideoEncoder || !window.Mp4Muxer)
    return status('Browser ini belum mendukung WebCodecs. Gunakan Chrome / Edge versi terbaru.');

  const { W, H, lw } = fmt(), fps = +$('fps').value;
  const enc = await pickCodec(W, H, fps);
  if (!enc) return status('Encoder video tidak tersedia di browser ini.');

  setBusy(true);
  $('download').style.display = 'none';
  $('bar').style.display = 'block';
  // same CSS layout as the preview, rendered at pixelRatio = output / layout
  recordPR = W / lw;
  applyLayout();

  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const ctx = out.getContext('2d', { willReadFrequently: true });
  const attrib = ATTRIB[$('style').value];
  const restoreRendering = takeOverRendering();

  let encErr = null;
  const muxer = new Mp4Muxer.Muxer({
    target: new Mp4Muxer.ArrayBufferTarget(),
    video: { codec: enc.mux, width: W, height: H, frameRate: fps },
    fastStart: 'in-memory'
  });
  const encoder = new VideoEncoder({
    output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
    error: e => { encErr = e; }
  });
  encoder.configure(enc.cfg);

  try {
    await Promise.all([ensureLayers(), loadFonts()]);
    labelLock = true;
    const frames = buildPlan(fps);
    const started = performance.now();
    let incomplete = 0;
    for (let i = 0; i < frames.length; i++) {
      if (encErr) throw encErr;
      const f = frames[i];
      applyFrame(f); renderHud(f.stats);
      if (!(await renderReady())) incomplete++;
      ctx.fillStyle = HAZE; ctx.fillRect(0, 0, W, H);   // MapLibre leaves the far gap transparent
      ctx.drawImage(map.getCanvas(), 0, 0, W, H);
      drawHud(ctx, W, H, f.stats, attrib);
      const vf = new VideoFrame(out, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
      encoder.encode(vf, { keyFrame: i % (fps * 2) === 0 });
      vf.close();
      while (encoder.encodeQueueSize > 8) await sleep(5);

      if (i % 5 === 0 || i === frames.length - 1) {
        const pct = (i + 1) / frames.length, el = (performance.now() - started) / 1000;
        const eta = pct > 0.02 ? Math.round(el / pct - el) : '…';
        $('bar').firstElementChild.style.width = (pct * 100).toFixed(1) + '%';
        status(`Rendering frame ${i + 1}/${frames.length} (${Math.round(pct*100)}%) · sisa ±${eta} dtk · biarkan tab ini tetap terbuka`);
      }
    }
    await encoder.flush();
    muxer.finalize();
    const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
    const url = URL.createObjectURL(blob);
    $('download').style.display = 'block';
    $('download').innerHTML = `<video src="${url}" controls></video><a href="${url}" download="flyover.mp4">⬇ Download flyover.mp4</a>`;
    const warn = incomplete ? ` ⚠ ${incomplete} frame tile petanya belum lengkap (koneksi lambat), coba generate ulang.` : '';
    status(`Selesai! ${W}×${H} @ ${fps}fps, ${(frames.length / fps).toFixed(1)} detik, ${(blob.size/1e6).toFixed(1)} MB. ${frames.info.note}${warn}`);
  } catch (err) {
    console.error(err);
    status('Gagal membuat video: ' + (err.message || err));
  } finally {
    try { encoder.state !== 'closed' && encoder.close(); } catch {}
    restoreRendering();
    labelLock = false;
    recordPR = null;
    applyLayout();
    $('bar').style.display = 'none';
    setBusy(false);
  }
});
renderHud(null);
loadFonts().then(() => renderHud());
</script>
</body>
</html>
